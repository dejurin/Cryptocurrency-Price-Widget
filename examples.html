<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CO-IN.IO cryptocurrency widget examples</title>
  <style>
    body { max-width: 54rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    section { margin-block: 2rem; }
    .price-list { max-width: 24rem; }
  </style>
</head>
<body>
  <main>
    <h1>CO-IN.IO cryptocurrency widgets</h1>
    <p>Both examples load hosted core 1.5.0 and require an internet connection.</p>
    <section>
      <h2>Cryptocurrency Price Widget</h2>
      <p><a href="https://co-in.io/crypto-price-widget/">Customize this price list</a></p>
      <div class="price-list">
        <script src="example.js"></script>
        <a href="https://currencyrate.today/">CurrencyRate.Today</a>
      </div>
    </section>
    <section>
      <h2>Crypto Ticker Widget</h2>
      <p><a href="https://co-in.io/crypto-ticker-widget/">Customize this inline ticker</a></p>
<script>
(function (anchor) {
  var items = "BTC,ETH,LTC";
  var base = "USD,EUR";
  var loader = document.createElement("script");
  loader.src = "https://co-in.io/widget/ticker.js?items=" + encodeURIComponent(items) + "&base=" + encodeURIComponent(base);
  loader.async = true;
  loader.onload = function () {
    var widget = crCryptocoinTickerWidget.init({
      items: items,
      base: base,
      streaming: "1",
      position: "inline",
      theme: "auto",
      speed: "normal"
    });
    anchor.parentNode.insertBefore(widget, anchor);
  };
  loader.onerror = function () {
    anchor.insertAdjacentText("beforebegin", "The crypto ticker widget could not load.");
  };
  anchor.parentNode.insertBefore(loader, anchor);
})(document.currentScript);
</script>
<a href="https://currencyrate.today/">CurrencyRate.Today</a>
    </section>
  </main>
</body>
</html>
